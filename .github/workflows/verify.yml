name: Verify application
on:
  pull_request:
    branches: [master]
  push:
    branches: [master, feature/frontend]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dbook
          POSTGRES_USER: dbook
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbook -d dbook"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/dbook
      SPRING_DATASOURCE_USERNAME: dbook
      SPRING_DATASOURCE_PASSWORD: test-only-password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SECURITY_JWT_SECRET: test-only-signing-key-for-isolated-ci-database-not-for-production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify backend
        run: ./mvnw -B verify
      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
          npm audit --audit-level=high
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start backend
        run: |
          java -jar target/booking-0.0.1-SNAPSHOT.jar > "$RUNNER_TEMP/backend.log" 2>&1 &
          for attempt in {1..60}; do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/test)" = 401 ]; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1
      - name: Verify browser workflows
        working-directory: frontend
        run: npm run test:e2e
