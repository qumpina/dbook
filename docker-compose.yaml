services:
  db:
    image: postgres:16-alpine
    container_name: dbook-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dbook}
      POSTGRES_USER: ${POSTGRES_USER:-dbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dbook} -d ${POSTGRES_DB:-dbook}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: dbook-app
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-dbook}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dbook}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      SPRING_LIQUIBASE_CONTEXTS: ${SPRING_LIQUIBASE_CONTEXTS:-}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}


      SECURITY_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SECURITY_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-15}
      SECURITY_JWT_REFRESH_TOKEN_EXPIRATION_DAYS: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-30}
    ports:
      - "8080:8080"

volumes:
  postgres_data: